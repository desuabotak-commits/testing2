<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARO PESAN APA AJA BRE</title>
    <!-- Menggunakan Tailwind CSS untuk desain yang modern dan keren -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Memanggil SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 md:p-8 font-sans">

    <!-- Header Judul -->
    <header class="text-center my-6 max-w-xl">
        <h1 class="text-4xl md:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 mb-2 animate-pulse">
            TARO PESAN APA AJA BRE
        </h1>
        <p class="text-slate-400 text-sm md:text-base font-medium">
            Ketik apa aja bebas, anonim (tanpa nama), dan langsung kelihatan sama semua orang di internet!
        </p>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-xl flex flex-col gap-6">
        
        <!-- Form Input Pesan -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
            <form id="formPesan" class="flex flex-col gap-3">
                <textarea 
                    id="isiPesan" 
                    rows="3" 
                    maxlength="300"
                    placeholder="Tulis bacotan, curhatan, atau pesan rahasia lo di sini..." 
                    class="w-full p-4 bg-slate-905 text-slate-200 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 placeholder-slate-500 resize-none transition-all"
                    required
                ></textarea>
                <button 
                    type="submit" 
                    class="w-full py-3 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:from-cyan-400 hover:to-fuchsia-500 text-white font-bold rounded-xl transition-all shadow-md transform active:scale-95 cursor-pointer"
                >
                    Kirim Pesan 🚀
                </button>
            </form>
        </div>

        <hr class="border-slate-700 my-2">

        <!-- Tempat Pesan Muncul -->
        <div class="flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-300 flex items-center gap-2">
                💬 Pesan Orang-Orang 
                <span id="loading" class="text-sm text-cyan-400 font-normal animate-bounce hidden">(Memuat...)</span>
            </h2>
            <div id="containerPesan" class="flex flex-col gap-3 max-h-[500px] overflow-y-auto pr-1">
                <!-- Pesan akan di-render di sini menggunakan JavaScript -->
                <p class="text-slate-500 text-center py-4">Belum ada pesan nih, jadilah yang pertama!</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto pt-8 text-xs text-slate-600 text-center">
        100% Anonim &bull; Jagalah Ketikan Bre
    </footer>

    <script>
        // === KONFIGURASI SUPABASE ===
        // Ganti dengan URL dan Anon Key dari Project Settings -> API di Supabase lo!
        const SUPABASE_URL = "https://URL_SUPABASE_LO.supabase.co";
        const SUPABASE_KEY = "KEY_ANON_SUPABASE_LO";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DOM Elements
        const formPesan = document.getElementById('formPesan');
        const isiPesanInput = document.getElementById('isiPesan');
        const containerPesan = document.getElementById('containerPesan');
        const loadingStatus = document.getElementById('loading');

        // Fungsi Ambil Pesan dari Database
        async function ambilPesan() {
            loadingStatus.classList.remove('hidden');
            const { data, error } = await supabase
                .from('pesan_anonim')
                .select('*')
                .order('created_at', { ascending: false });

            loadingStatus.classList.add('hidden');

            if (error) {
                console.error("Gagal ambil data:", error);
                return;
            }

            if (data.length === 0) {
                containerPesan.innerHTML = `<p class="text-slate-500 text-center py-4">Belum ada pesan nih, jadilah yang pertama!</p>`;
                return;
            }

            // Tampilkan ke layar
            containerPesan.innerHTML = data.map(pesan => {
                // Format waktu lokal singkat
                const waktu = new Date(pesan.created_at).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                return `
                    <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 hover:border-slate-600 transition-all shadow-sm">
                        <p class="text-slate-200 whitespace-pre-line break-words text-sm md:text-base">${escapeHTML(pesan.isi_pesan)}</p>
                        <div class="flex justify-between items-center mt-3 text-[10px] md:text-xs text-slate-500 font-semibold tracking-wider">
                            <span>👤 ANONIM</span>
                            <span>Today, ${waktu}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Fungsi Kirim Pesan
        formPesan.addEventListener('submit', async (e) => {
            e.preventDefault();
            const teks = isiPesanInput.value.trim();
            
            if(!teks) return;

            const { error } = await supabase
                .from('pesan_anonim')
                .insert([{ isi_pesan: teks }]);

            if (error) {
                alert("Gagal kirim pesan bre, coba lagi!");
                console.error(error);
            } else {
                isiPesanInput.value = ''; // Kosongkan inputan
                ambilPesan(); // Refresh pesan terbaru
            }
        });

        // Pengaman anti hacker iseng (XSS Protection)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Jalankan fungsi ambil pesan saat web pertama dibuka
        ambilPesan();

        // Fitur Realtime: Supaya otomatis muncul kalau ada orang lain yang kirim tanpa perlu di-refresh
        supabase
            .channel('schema-db-changes')
            .on('postgres_changes', { event: 'INSERT', scheme: 'public', table: 'pesan_anonim' }, () => {
                ambilPesan();
            })
            .subscribe();
    </script>
</body>
</html>
