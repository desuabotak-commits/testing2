<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goxia AI - Image Generator</title>
    <style>
        :root {
            --primary-color: #4f46e5; /* Biru Indigo Modern */
            --dark-color: #0f172a; /* Slate Gelap */
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --muted-text: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--dark-color);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 30px;
            flex: 1;
        }

        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: fit-content;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #1e293b;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
        }

        textarea, select, input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background-color: #fff;
        }

        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .radio-tile-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .radio-tile-group.four-cols {
            grid-template-columns: repeat(4, 1fr);
        }

        .tile-btn {
            background: #f1f5f9;
            border: 2px solid transparent;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
        }

        .tile-btn:hover {
            background: #e2e8f0;
        }

        .tile-btn.active {
            background: #eef2ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-generate {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-generate:hover {
            background-color: #4338ca;
        }

        /* Output / Gallery Panel */
        .output-panel {
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }

        .preview-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            background: #f1f5f9;
            border: 3px dashed #cbd5e1;
            border-radius: 8px;
            color: var(--muted-text);
            text-align: center;
            padding: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            display: none;
        }

        .gallery-item {
            background: #f8fafc;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
            background-color: #e2e8f0;
        }

        .img-info {
            padding: 8px 12px;
            font-size: 11px;
            color: var(--muted-text);
            background: #fff;
            border-top: 1px solid var(--border-color);
        }

        /* Loading Animation */
        .loader-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .loader {
            border: 5px solid #e2e8f0;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ goxia AI</h1>
        <p>APLIKASI INI DIGUNAKAN UNTUK MEMBUAT GAMBAR DENGAN MUDAH DAN GRATIS</p>
    </header>

    <div class="container">
        <div class="panel">
            <h2>Konfigurasi Generator</h2>
            
            <div class="form-group">
                <label>Model AI Gambar:</label>
                <div class="radio-tile-group">
                    <button class="tile-btn active" id="model-banana2" onclick="setModel('Nano Banana 2')">🍌 Nano Banana 2</button>
                    <button class="tile-btn" id="model-bananapro" onclick="setModel('Nano Banana Pro')">🚀 Nano Banana Pro</button>
                </div>
            </div>

            <div class="form-group">
                <label>Suasana Waktu (Lighting Mood):</label>
                <div class="radio-tile-group four-cols">
                    <button class="tile-btn active" id="mood-pagi" onclick="setMood('Pagi')">🌅 Pagi</button>
                    <button class="tile-btn" id="mood-siang" onclick="setMood('Siang')">☀️ Siang</button>
                    <button class="tile-btn" id="mood-sore" onclick="setMood('Sore')">🌇 Sore</button>
                    <button class="tile-btn" id="mood-malam" onclick="setMood('Malam')">🌌 Malam</button>
                </div>
            </div>

            <div class="form-group">
                <label>Prompt Deskripsi Gambar:</label>
                <textarea id="prompt-input" rows="4" placeholder="Contoh: Istana megah di atas awan, gaya fantasi cinematic..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Pilihan Rasio Lengkap:</label>
                    <select id="ratio-input">
                        <option value="1:1">1:1 (Square / Kotak)</option>
                        <option value="16:9">16:9 (Landscape / TV)</option>
                        <option value="9:16">9:16 (Vertikal / Story TikTok)</option>
                        <option value="4:3">4:3 (Klasik / Foto)</option>
                        <option value="3:4">3:4 (Potret Blog)</option>
                        <option value="2:1">2:1 (Ultrawide Banner)</option>
                        <option value="2:3">2:3 (Poster Film)</option>
                    </select>
                </div>
                
                <div class="form-group" style="margin-bottom:0;">
                    <label>Jumlah Gambar (Maks 6):</label>
                    <input type="number" id="quantity-input" min="1" max="6" value="1">
                </div>
            </div>

            <button class="btn-generate" onclick="generateImages()">
                ⚡ Mulai Buat Gambar
            </button>
        </div>

        <div class="panel output-panel">
            <h2>Hasil Gambar</h2>
            
            <div class="loader-container" id="loader-box">
                <div class="loader"></div>
                <p id="loading-text" style="color: var(--muted-text); font-weight: 500;"></p>
            </div>

            <div class="preview-placeholder" id="placeholder-box">
                <p style="font-size: 48px; margin-bottom: 10px;">🎨</p>
                <p>Belum ada gambar yang dibuat.<br>Atur konfigurasi di panel kiri dan klik tombol buat.</p>
            </div>

            <div class="gallery-grid" id="gallery-box"></div>
        </div>
    </div>

    <script>
        // State Konfigurasi Global
        let selectedModel = 'Nano Banana 2';
        let selectedMood = 'Pagi';

        // Fungsi Mengubah Pilihan Model
        function setModel(modelName) {
            selectedModel = modelName;
            document.getElementById('model-banana2').classList.remove('active');
            document.getElementById('model-bananapro').classList.remove('active');
            
            if(modelName === 'Nano Banana 2') {
                document.getElementById('model-banana2').classList.add('active');
            } else {
                document.getElementById('model-bananapro').classList.add('active');
            }
        }

        // Fungsi Mengubah Pilihan Suasana
        function setMood(moodName) {
            selectedMood = moodName;
            document.getElementById('mood-pagi').classList.remove('active');
            document.getElementById('mood-siang').classList.remove('active');
            document.getElementById('mood-sore').classList.remove('active');
            document.getElementById('mood-malam').classList.remove('active');
            
            document.getElementById('mood-' + moodName.toLowerCase()).classList.add('active');
        }

        // Fungsi Pemrosesan Generate Multi Gambar Berdasarkan Fitur Baru
        function generateImages() {
            const prompt = document.getElementById('prompt-input').value;
            let qty = parseInt(document.getElementById('quantity-input').value);
            const ratio = document.getElementById('ratio-input').value;

            // Validasi input batas jumlah gambar (Maksimal 6)
            if (isNaN(qty) || qty < 1) qty = 1;
            if (qty > 6) {
                alert('Jumlah gambar maksimal yang diizinkan adalah 6 gambar!');
                document.getElementById('quantity-input').value = 6;
                qty = 6;
            }

            if (!prompt) {
                alert('Silakan masukkan prompt deskripsi gambar terlebih dahulu!');
                return;
            }

            const placeholderBox = document.getElementById('placeholder-box');
            const loaderBox = document.getElementById('loader-box');
            const galleryBox = document.getElementById('gallery-box');
            const loadingText = document.getElementById('loading-text');

            // Reset Tampilan ke mode loading
            placeholderBox.style.display = 'none';
            galleryBox.style.display = 'none';
            loaderBox.style.display = 'flex';
            loadingText.innerText = `Memproses ${qty} gambar menggunakan engine ${selectedModel} dengan nuansa ${selectedMood}...`;

            // Simulasi rendering engine goxia AI (2.5 detik)
            setTimeout(() => {
                loaderBox.style.display = 'none';
                galleryBox.style.display = 'grid';
                galleryBox.innerHTML = ''; // Kosongkan galeri lama

                // Array mockup gambar bernuansa estetik dari Unsplash
                const sampleImages = [
                    "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80",
                    "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=400&q=80",
                    "https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?auto=format&fit=crop&w=400&q=80",
                    "https://images.unsplash.com/photo-1604871000636-074fa5117945?auto=format&fit=crop&w=400&q=80",
                    "https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=400&q=80",
                    "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=400&q=80"
                ];

                // Render jumlah gambar sesuai permintaan user (maks 6)
                for (let i = 0; i < qty; i++) {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    
                    // Sesuaikan simulasi pemotongan rasio visual menggunakan CSS aspect-ratio inline
                    let cssRatio = "1 / 1";
                    if(ratio === "16:9") cssRatio = "16 / 9";
                    if(ratio === "9:16") cssRatio = "9 / 16";
                    if(ratio === "4:3") cssRatio = "4 / 3";
                    if(ratio === "3:4") cssRatio = "3 / 4";
                    if(ratio === "2:1") cssRatio = "2 / 1";
                    if(ratio === "2:3") cssRatio = "2 / 3";

                    item.innerHTML = `
                        <img src="${sampleImages[i % sampleImages.length]}" style="aspect-ratio: ${cssRatio};" alt="Render ${i+1}">
                        <div class="img-info">
                            <strong>Variasi #${i + 1}</strong><br>
                            Model: ${selectedModel} | Waktu: ${selectedMood} | Rasio: ${ratio}
                        </div>
                    `;
                    galleryBox.appendChild(item);
                }

            }, 2500);
        }
    </script>
</body>
</html>
