<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATAN BAU BANGET</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#000,#0f172a,#2563eb);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    padding:20px;
    width:100%;
}

.title{
    font-size:clamp(30px,8vw,60px);
    font-weight:900;
    color:white;
    text-transform:uppercase;
    text-shadow:
        0 0 5px #fff,
        0 0 10px #3b82f6,
        0 0 15px #3b82f6;
}

.line{
    width:80%;
    max-width:300px;
    height:3px;
    margin:15px auto;
    background:linear-gradient(
        90deg,
        transparent,
        #3b82f6,
        white,
        #3b82f6,
        transparent
    );
}

.subtitle{
    font-size:clamp(18px,5vw,30px);
    font-weight:bold;
    color:#60a5fa;
    text-shadow:
        0 0 5px #3b82f6;
}

.tag{
    margin-top:15px;
    font-size:14px;
    color:#dbeafe;
}
</style>
</head>
<body>

<div class="container">

    <div class="title">
        FATAN BAU BANGET
    </div>

    <div class="line"></div>

    <div class="subtitle">
        🎮 MAIN GAK OIII 🎮
    </div>


</div>

</body>
</html>
